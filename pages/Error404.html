<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Landing Workshop para el evento de Rolling Code"
    />
    <meta
      name="keywords"
      content="información, evento, Rolling Code, horarios, precios, ubicación"
    />
    <meta
      name="author"
      content="Facundo Alvarez, Lautaro Carrizo, Agustín Herrera, Luca Octavio, Tadeo Leonel Jerez, Martin Javier Veliz"
    />

    <title>Landing Workshop</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;1,300&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="navbar-bg">
      <nav class="navbar navbar-expand-lg navar-color">
        <div class="container pb-2">
          <a class="navbar-brand" href="#inicio">
            <img
              class="nabar-img"
              src="../img/logoWhite.webp"
              alt="Logo de Rolling Code"
            />
          </a>
        </div>
      </nav>
    </header>
    <main
      class="error-main container-fluid d-flex align-items-center justify-content-center text-center py-5"
    >
      <section class="container py-4 py-lg-5">
        <div class="mb-4">
          <span class="error-badge rounded-pill px-4 py-2 fw-bold small">
            ERROR
            <span class="d-block">404</span>
          </span>
        </div>
        <h1 class="error-number fw-bold lh-1 mb-3">404</h1>
        <h2 class="text-white fw-bold display-6 mb-3">Página no encontrada</h2>
        <p class="error-description fs-5 mx-auto mb-5">
          Lo sentimos, la página que estás buscando no existe, ha sido eliminada
          o su dirección cambió.
        </p>
        <div
          class="d-flex flex-column flex-sm-row justify-content-center align-items-stretch gap-3"
        >
          <a
            href="/"
            class="btn error-button-primary rounded-pill fw-bold px-5 py-2"
          >
            Volver al inicio
          </a>

          <a
            href="/#agenda"
            class="btn error-button-secondary rounded-pill fw-bold px-5 py-2"
          >
            Ver el workshop
          </a>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div
        class="container d-flex justify-content-between align-items-center flex-wrap gap-4"
      >
        <img
          class="footer__logo"
          src="../img/logoWhite.webp"
          alt="Rolling Code School"
        />

        <ul class="footer__redes list-unstyled d-flex gap-2 m-0 p-0">
          <li>
            <a
              class="footer__red"
              href="https://www.instagram.com/rollingcodeschool/"
              target="_blank"
              rel="noopener"
              aria-label="Instagram"
            >
              <i class="bi bi-instagram"></i>
            </a>
          </li>

          <li>
            <a
              class="footer__red"
              href="https://www.facebook.com/RollingCodeSchool/"
              target="_blank"
              rel="noopener"
              aria-label="Facebook"
            >
              <i class="bi bi-facebook"></i>
            </a>
          </li>

          <li>
            <a
              class="footer__red"
              href="https://www.linkedin.com/school/rollingcodeschool/"
              target="_blank"
              rel="noopener"
              aria-label="LinkedIn"
            >
              <i class="bi bi-linkedin"></i>
            </a>
          </li>

          <li>
            <a
              class="footer__red"
              href="https://www.youtube.com/@rollingcode7175"
              target="_blank"
              rel="noopener"
              aria-label="YouTube"
            >
              <i class="bi bi-youtube"></i>
            </a>
          </li>

          <li>
            <a
              class="footer__red"
              href="https://x.com/rollingcodeok"
              target="_blank"
              rel="noopener"
              aria-label="X"
            >
              <i class="bi bi-twitter-x"></i>
            </a>
          </li>

          <li>
            <a
              class="footer__red"
              href="https://github.com/rollingcodestudio"
              target="_blank"
              rel="noopener"
              aria-label="GitHub"
            >
              <i class="bi bi-github"></i>
            </a>
          </li>
        </ul>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
