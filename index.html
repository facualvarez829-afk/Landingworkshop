       <article>
        
<!-- Título principal -->
<h1 class="text-white fw-bold mb-0">
  Finalizá tu compra
</h1>

<!-- Pasos de compra -->
<nav class="checkout-steps d-flex flex-wrap justify-content-lg-end gap-2"
     aria-label="Etapas de compra">

  <a href="#entrada" class="step-link active">
    1 Entrada
  </a>

  <a href="#datos" class="step-link">
    2 Datos
  </a>

  <a href="#pago" class="step-link">
    3 Pago
  </a>

  <a href="#listo" class="step-link">
    4 Listo
  </a>

</nav>

<!-- Panel de entradas -->
<section class="ticket-selection bg-white text-black p-3 p-md-4 rounded-4">

  <h2 class="fw-bold fs-5 mb-3">
    Elegí tu entrada
  </h2>

  <div class="d-grid gap-2">

    <label class="ticket-option d-flex justify-content-between align-items-center gap-3 p-3 rounded-4">
      <input type="radio" name="ticket" value="early" checked
             class="visually-hidden">

      <span class="d-flex flex-column">
        <span class="ticket-name fw-bold">Early Bird</span>
        <span class="ticket-description small">
          Presencial · hasta el 31/10
        </span>
      </span>

      <span class="ticket-price fw-bold text-nowrap">$25.000</span>
    </label>

    <label class="ticket-option d-flex justify-content-between align-items-center gap-3 p-3 rounded-4">
      <input type="radio" name="ticket" value="general"
             class="visually-hidden">

      <span class="d-flex flex-column">
        <span class="ticket-name fw-bold">General</span>
        <span class="ticket-description small">
          Presencial · desde el 1/11
        </span>
      </span>

      <span class="ticket-price fw-bold text-nowrap">$35.000</span>
    </label>

    <label class="ticket-option d-flex justify-content-between align-items-center gap-3 p-3 rounded-4">
      <input type="radio" name="ticket" value="virtual"
             class="visually-hidden">

      <span class="d-flex flex-column">
        <span class="ticket-name fw-bold">Virtual</span>
        <span class="ticket-description small">
          Transmisión en vivo y grabación
        </span>
      </span>

      <span class="ticket-price fw-bold text-nowrap">$15.000</span>
    </label>

  </div>
</section>
